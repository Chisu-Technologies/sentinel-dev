# ===========================================================================
# Sentinel sandbox — Squid proxy de PAQUETES con ALLOW-LIST (PHASE4 §2.1).
#
# Rol: única salida a internet del contenedor efímero de tests. El hijo corre
# en la red restringida `sentinel_sandbox_net` (sin egress directo) y recibe
# HTTP_PROXY/HTTPS_PROXY apuntando aquí. Este proxy SOLO deja pasar los dominios
# de allowlist.txt (registries de paquetes). Deny-by-default — alineado con la
# filosofía PolicyGate de Sentinel.
#
# ⚠️ NO es un proxy de caché general ni un proxy abierto: rechaza todo lo que no
#    esté en la allow-list, incluido cualquier intento de exfiltración del código
#    no confiable del repo objetivo.
#
# Imagen sugerida (compose, Fase 6): ubuntu/squid:6.6-24.04_beta (pineada) o
# equivalente; monta este conf y allowlist.txt en /etc/squid/.
# ===========================================================================

# --- Puerto del proxy ------------------------------------------------------
# 3128 estándar. Solo en la red interna del sandbox (no publicado al host).
http_port 3128
# Squid runs in foreground as the container's PID 1, so Docker owns process
# lifecycle and no mutable PID file is required.
pid_filename none
visible_hostname sentinel-package-proxy

# --- ACLs ------------------------------------------------------------------
# Dominios permitidos (allow-list). Un fichero externo para que el operador lo
# edite sin tocar la lógica del conf.
acl allowed_pkg_domains dstdomain "/etc/squid/allowlist.txt"

# Puertos permitidos: HTTPS (443) y HTTP (80). Los registries usan HTTPS; 80 se
# deja por redirecciones iniciales de algún mirror, pero el destino sigue
# acotado por dominio.
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

# Metadatos de nube y enlace local, por DIRECCIÓN de destino. La allow-list es
# por NOMBRE: si un dominio permitido resolviera a una de estas direcciones
# (DNS manipulado, o un dominio que alguien añada a la lista), sin esta regla el
# proxy abriría la conexión hacia las credenciales de la instancia.
#   169.254.0.0/16   enlace local: 169.254.169.254 (AWS, GCP, Azure, OpenStack,
#                    DigitalOcean) y 169.254.170.2 (credenciales de tarea ECS)
#   fe80::/10        enlace local IPv6
#   fd00:ec2::254    metadatos de AWS por IPv6
#   100.100.100.200  metadatos de Alibaba Cloud
#   192.0.0.192      metadatos de Oracle Cloud
acl cloud_metadata dst 169.254.0.0/16 fe80::/10 fd00:ec2::254 100.100.100.200 192.0.0.192

# --- Reglas de acceso (orden importa: primer match gana) -------------------
# 0) Metadatos de nube: nunca. Va la PRIMERA para que ningún allow la preceda.
http_access deny cloud_metadata
# 1) CONNECT (túnel TLS) SOLO a 443 (no permitimos CONNECT a puertos raros).
http_access deny CONNECT !SSL_ports
# 2) Rechaza puertos no seguros de entrada.
http_access deny !Safe_ports
# 3) PERMITE solo los dominios de la allow-list (en Safe_ports).
http_access allow allowed_pkg_domains Safe_ports
# 4) DENY-BY-DEFAULT: todo lo demás se rechaza. Esta línea es la garantía.
http_access deny all

# --- Endurecimiento / privacidad ------------------------------------------
# No revelar la versión de Squid ni cabeceras internas.
httpd_suppress_version_string on
via off
forwarded_for delete
# Sin caché en disco: el cache de wheels lo hace el volumen pip_cache del worker
# (Fase 6), no el proxy. El proxy es solo control de egress.
cache deny all
# Logging: NO especificamos access_log/cache_log custom. Squid baja a su usuario
# sin privilegios (`proxy`), que NO puede abrir /dev/stdout → "FATAL: Cannot open
# '/dev/stdout'" y aborta. La imagen ubuntu/squid ya configura sus logs a rutas
# escribibles por `proxy` (/var/log/squid/) y los expone vía docker logs por su
# propio entrypoint. Dejamos esos defaults: `docker compose logs pkg-proxy`
# muestra el access.log igual. (Para depurar accesos puntuales:
#   docker compose exec pkg-proxy tail -f /var/log/squid/access.log )

# DNS: resuelve los dominios de la allow-list. (En compose usa el resolver de
# docker; no hace falta dns_nameservers explícito.)

# Sin ICP/HTCP (no hay jerarquía de proxies).
icp_port 0
