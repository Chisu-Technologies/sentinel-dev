name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer run on the same ref makes the older one moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      # The client ships for three systems; one failing must not hide the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Later steps run code from the pull request; they do not need the token.
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Format
        if: runner.os == 'Linux'
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      # The race detector needs cgo, which the Linux runner has ready.
      - name: Test with the race detector
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Build
        run: go build ./cmd/sentinel

  installer:
    name: installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Installer tests
        if: runner.os != 'Windows'
        run: bash scripts/install_test.sh
      # The two PowerShells differ; people have either.
      - name: Installer tests on Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: scripts\install_test.ps1
      - name: Installer tests on PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts\install_test.ps1
      # The archives need GNU tar, which the Linux runner has. Built twice to hold
      # the promise that one commit gives the same bytes.
      - name: Build a release twice and install from it
        if: runner.os == 'Linux'
        run: |
          bash scripts/build-release.sh v0.0.0 dist
          bash scripts/build-release.sh v0.0.0 dist-again
          diff dist/SHA256SUMS dist-again/SHA256SUMS
          test "$(ls dist | wc -l)" -eq 7
          home=$(mktemp -d)
          HOME="$home" SENTINEL_DOWNLOAD_BASE="$PWD/dist" sh scripts/install.sh
          "$home/.local/bin/sentinel" version | grep -F "sentinel v0.0.0 "
