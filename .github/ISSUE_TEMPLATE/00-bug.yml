name: Bug report
description: A command of sentinel does something wrong.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        The commands that exist today are listed in docs/commands.md. Please do not
        use this form for security problems; see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `sentinel version`.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What you ran
      description: The exact command, and the operating system of your machine and of the server.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened, and what you expected
      description: Paste the output. Remove hostnames and anything private first.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: This report contains no credentials and no other people's data.
          required: true
