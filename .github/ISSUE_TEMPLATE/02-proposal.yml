name: Proposal
description: Propose a change or a feature. Open this before you write a pull request.
title: "proposal: "
body:
  - type: markdown
    attributes:
      value: |
        Please open an issue before sending a pull request for a new feature or a
        behavior change. A pull request that nobody agreed to may be closed without
        review. The hosted service is closed source and is not in scope here.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today, or what goes wrong?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you change?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve it, including doing nothing.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and did not find this proposal.
          required: true
        - label: This is not a security problem. I read SECURITY.md.
          required: true
